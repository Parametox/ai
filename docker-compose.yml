services:
  postgres:
    image: postgres:17-alpine
    container_name: kanbanlite-postgres
    environment:
      POSTGRES_DB: kanbanlite
      POSTGRES_USER: kanbanlite
      POSTGRES_PASSWORD: kanbanlite
    ports:
      - "5432:5432"
    volumes:
      - kanbanlite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbanlite -d kanbanlite"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kanbanlite_pgdata:

