services:
  postgres:
    image: postgres:16
    container_name: kanbanlite-postgres
    environment:
      POSTGRES_DB: kanbanlite
      POSTGRES_USER: kanbanlite
      POSTGRES_PASSWORD: kanbanlite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbanlite -d kanbanlite"]
      interval: 10s
      timeout: 5s
      retries: 5

