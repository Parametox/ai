name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/KanbanLite.Application.UnitTests --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Start application in background
        run: |
          dotnet run --project src/Web --configuration Release --urls "http://localhost:5145" &
          echo $! > app.pid
          sleep 15
        env:
          ConnectionStrings__KanbanConnectionString: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          Supabase__Url: "https://fntdzqdxfbddesaijpdr.supabase.co"
          Supabase__Key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ASPNETCORE_ENVIRONMENT: Production

      - name: Wait for application to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5145/login > /dev/null; then
              echo "Application is ready!"
              break
            fi
            echo "Waiting for application... ($i/30)"
            sleep 2
          done

      - name: Build E2E Tests project
        run: dotnet build tests/KanbanLite.E2E.Tests --configuration Release

      - name: Run E2E Tests
        run: dotnet test tests/KanbanLite.E2E.Tests --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=e2e-tests.trx"
        env:
          E2E_BASE_URL: "http://localhost:5145"
          E2E_MANAGER_USERNAME: "menago"
          E2E_MANAGER_PASSWORD: "menago"
          E2E_OPERATOR_USERNAME: "operator"
          E2E_OPERATOR_PASSWORD: "operator"
          PLAYWRIGHT_HEADLESS: "true"

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: '**/playwright-traces/'
          retention-days: 7
