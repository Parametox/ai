  #   runs-on: ubuntu-latest
  #   name: Deploy to Production
  #   needs: build-docker
  #   environment: production
  #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
  #
  #   steps:
  #     - name: Install doctl
  #       uses: digitalocean/action-doctl@v2
  #       with:
  #         token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
  #
  #     - name: Deploy to DigitalOcean App Platform
  #       run: |
  #         doctl apps create-deployment ${{ secrets.DIGITALOCEAN_APP_ID }} --wait
  #
  #     - name: Deployment Summary
  #       run: |
  #         echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
  #         echo "" >> $GITHUB_STEP_SUMMARY
  #         echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
  #         echo "**Image Digest:** \`${{ needs.build-docker.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
  #         echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 5: Summary - Podsumowanie pipeline'u
  # ============================================================================
  summary:
    runs-on: ubuntu-latest
    name: Pipeline Summary
    needs: [lint, unit-test, build-docker]
    if: always()

    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "## 📊 Master Branch Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build-docker.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
